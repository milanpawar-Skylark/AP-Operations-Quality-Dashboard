<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operations Quality Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;--bg:#eef1f6;--surface:#fff;--ink:#1b2a41;--muted:#5b6b80;--line:#dfe4ec;--navy:#1f3a5f;--green:#1e8e5a;--blue:#2f6fb0;--amber:#c27d0e;--red:#c53a30;--grey:#8795a8;--pale:#a9bcd3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:var(--navy);color:#fff;padding:26px 20px}
.hero div{max-width:1180px;margin:0 auto}
h1{font-size:28px;font-weight:600;margin:0;letter-spacing:-.01em}
.hero p{margin:4px 0 0;color:#c4d2e6}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 48px}
.filters{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:8px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
select,button{font:inherit;border-radius:6px;border:1px solid var(--line);padding:7px 12px;background:var(--surface);color:var(--ink)}
button{cursor:pointer}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h2.sec{font-size:18px;font-weight:600;margin:30px 0 12px;color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,33,61,.08)}
.card .l{font-size:13px;color:var(--muted)}
.card .v{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:2px 0}
.card .n{font-size:13px;color:var(--muted)}
.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--grey)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
h3{font-size:16px;font-weight:600;margin:0 0 2px}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
svg{width:100%;height:auto;display:block}
.scroll{overflow-x:auto}
.stack{display:flex;height:30px;border-radius:5px;overflow:hidden;background:var(--line)}
.stack span{color:#fff;font-size:13px;font-weight:600;line-height:30px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.loc h3{display:flex;justify-content:space-between;align-items:baseline}
.loc .big{font-size:28px;font-weight:600;margin:6px 0 2px}
.loc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:14px}
.loc dt{color:var(--muted)}.loc dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
ol.list{list-style:none;margin:0;padding:0}
ol.list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
ol.list li:first-child{border-top:0}
ol.list small{color:var(--muted);display:block}
ol.list b{font-variant-numeric:tabular-nums;white-space:nowrap}
ul.ins{margin:0;padding-left:20px}ul.ins li{margin:6px 0}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{background:#f6f8fb;font-weight:500;color:var(--muted);font-size:13px}
td.n,th.n{text-align:right}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#fff}
.empty{color:var(--muted);padding:24px;text-align:center}
.foot{font-size:13px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<div class="hero"><div>
  <h1>Operations Quality Dashboard</h1>
  <p id="sub"></p>
</div></div>
<div class="wrap">
  <div class="filters">
    <label>Location<select id="fLoc"><option>All Locations</option><option>Hyderabad</option><option>Mumbai</option><option>Turbhe</option></select></label>
    <label>Performance<select id="fBand"><option>All</option><option>Excellent (≥99.5%)</option><option>Good (≥99%)</option><option>Fair (≥98.5%)</option><option>Needs Attention</option></select></label>
    <label>Trend<select id="fTrend"><option>All</option><option>Improved</option><option>Declined</option><option>Stable</option></select></label>
    <button class="pri" id="apply">Apply</button><button id="reset">Reset</button>
    <span id="fInfo" style="font-size:13px;color:var(--muted)"></span>
  </div>
  <div id="app"></div>
  <p class="foot">Performance bands: Excellent ≥ 99.50% | Good ≥ 99.00% | Fair ≥ 98.50% | Needs Attention &lt; 98.50%. Trend: Improved or Declined when the weekly change is more than 0.05 pts, otherwise Stable. Target = 99.00%.</p>
</div>
<script>
const DATA=[
["Ariba Starbucks","Hyderabad",[99.21,98.72,99.16,99.57]],
["Coupa Sonic Automotive","Hyderabad",[99.08,99.19,99.07,99.16]],
["SunriseSeniorLivin","Hyderabad",[99.66,99.47,99.57,99.38]],
["Siemens-AP","Hyderabad",[98.95,99.30,99.25,99.17]],
["PULTE-AP","Mumbai",[98.62,98.93,98.88,98.99]],
["Ross AP","Mumbai",[98.70,98.60,98.86,98.83]],
["AMSURG","Mumbai",[98.91,98.72,98.82,98.82]],
["UPMC-AP","Mumbai",[99.57,99.48,99.52,99.52]],
["Penn National Gaming","Mumbai",[99.79,99.89,99.80,99.74]],
["Darigold","Mumbai",[99.22,98.92,99.52,99.49]],
["Ariba Otsuka","Mumbai",[97.75,98.94,98.87,98.16]],
["Ariba Country Financial","Mumbai",[99.54,99.37,99.17,99.52]],
["Erie AP","Mumbai",[99.08,99.20,99.16,99.37]],
["Freddie Mac AP Express","Mumbai",[98.97,99.64,99.47,99.12]],
["Coupa Waste Management","Turbhe",[98.63,99.11,99.18,99.30]],
["Altria","Turbhe",[99.12,99.23,99.30,99.48]],
["Coupa XPO Logistics","Turbhe",[99.59,99.67,99.13,99.26]],
["Murphy Hoffman","Turbhe",[99.83,99.81,99.71,99.71]],
["UMMS","Turbhe",[99.52,99.43,99.57,99.69]],
["Direct Energy","Turbhe",[98.98,99.36,99.48,99.45]],
["RXO and XPO Logistics","Turbhe",[100.00,100.00,100.00,null]]];
const LOCS=["Hyderabad","Mumbai","Turbhe"],TARGET=99,TOL=0.05;
const BN=["Excellent","Good","Fair","Needs Attention"],BC=["var(--green)","var(--blue)","var(--amber)","var(--red)"];
let lw=0;DATA.forEach(p=>p[2].forEach((v,i)=>{if(v!=null&&i>lw)lw=i}));
const ROWS=DATA.map(p=>{const cu=p[2][lw],pr=lw>0?p[2][lw-1]:null;return{n:p[0],l:p[1],cu,pr,d:cu!=null&&pr!=null?cu-pr:null}}).filter(r=>r.cu!=null);
const band=v=>v>=99.5?0:v>=99?1:v>=98.5?2:3;
const trend=d=>d==null||Math.abs(d)<=TOL?"Stable":d>0?"Improved":"Declined";
const avg=a=>{a=a.filter(x=>x!=null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const f2=v=>v==null?"–":v.toFixed(2)+"%";
const sg=(v,u)=>v==null?"–":(v>0?"+":"")+v.toFixed(2)+(u||"");
const tcl=d=>d==null||Math.abs(d)<=TOL?"flat":d>0?"up":"down";
const PW="WK "+lw,CW="WK "+(lw+1);
let F={loc:"All Locations",band:"All",trend:"All"};
/* Volume and error data from the location sheets (October weeks 1 and 2). Quality = 1 - errors / (docs x fields per doc) */
const WK=["Oct W1","Oct W2","Oct W3","Oct W4"],CI=lw,PI=lw-1;
const VOLD={
"Ariba Starbucks":[23,[[395,72],[505,149],[568,110],[412,41]]],
"Coupa Sonic Automotive":[14,[[5549,711],[6178,697],[7107,923],[6739,795]]],
"SunriseSeniorLivin":[15,[[1634,83],[2335,186],[2145,138],[2331,216]]],
"Siemens-AP":[19,[[371,74],[340,45],[414,59],[196,31]]],
"PULTE-AP":[18,[[5122,1275],[3498,673],[3369,680],[3296,599]]],
"Ross AP":[18,[[1472,345],[1396,352],[1300,266],[1204,254]]],
"AMSURG":[18,[[3522,690],[3081,712],[2734,580],[2711,575]]],
"UPMC-AP":[17,[[2608,191],[2563,225],[2400,195],[2558,208]]],
"Penn National Gaming":[24,[[1672,83],[1861,50],[2114,102],[1668,104]]],
"Darigold":[15,[[77,9],[123,20],[152,11],[195,15]]],
"Ariba Otsuka":[20,[[102,46],[80,17],[31,7],[87,32]]],
"Ariba Country Financial":[18,[[144,12],[115,13],[67,10],[92,8]]],
"Erie AP":[19,[[154,27],[99,15],[50,8],[50,6]]],
"Freddie Mac AP Express":[10,[[117,12],[112,4],[150,8],[148,13]]],
"Coupa Waste Management":[13,[[3016,539],[3504,407],[3459,368],[3567,323]]],
"Altria":[15,[[1746,230],[1551,178],[1573,166],[1884,146]]],
"Coupa XPO Logistics":[18,[[618,46],[324,19],[351,55],[241,32]]],
"Murphy Hoffman":[18,[[949,29],[884,31],[883,46],[1003,53]]],
"UMMS":[19,[[1400,129],[1350,147],[1433,118],[1252,74]]],
"Direct Energy":[11,[[178,20],[114,8],[175,10],[313,19]]],
"RXO and XPO Logistics":[17,[[7,0],[32,0],[2,0]]]};
const S={};DATA.forEach(p=>{const v=VOLD[p[0]];if(!v)return;const d=v[1].map(x=>x[0]),e=v[1].map(x=>x[1]);
  S[p[0]]={n:p[0],l:p[1],f:v[0],d,e,q:d.map((x,i)=>100*(1-e[i]/(x*v[0])))}});
const sum=a=>a.reduce((x,y)=>x+(y||0),0),LC={Mumbai:"var(--blue)",Hyderabad:"var(--amber)",Turbhe:"var(--green)"};
function wq(X,ix){const a=[];X.forEach(s=>ix.forEach(i=>{if(s.d[i]>0)a.push([s.e[i],s.d[i]*s.f,s.d[i]])}));return a.length?{q:100*(1-sum(a.map(x=>x[0]))/sum(a.map(x=>x[1]))),d:sum(a.map(x=>x[2])),e:sum(a.map(x=>x[0])),n:a.length}:null}
const tbl=(h,rows)=>`<div class="scroll"><table><thead><tr>${h.map((x,i)=>`<th class="${i>1?"n":""}">${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;

function deep(R){
  const nm=new Set(R.map(r=>r.n)),P=Object.values(S).filter(s=>nm.has(s.n));
  const m=P.map(s=>{const cur=s.q[CI],prev=s.q[PI];return{...s,cur,prev,dq:cur-prev,dv:(s.d[CI]/s.d[PI]-1)*100,c:(()=>{let k=0;for(let i=CI;i>=0&&s.q[i]<TARGET;i--)k++;return k})()}});
  const watch=m.filter(s=>s.cur<TARGET&&(s.dq<0||s.c>=2)).map(s=>({...s,risk:(TARGET-s.cur)+.15*s.c+Math.max(0,-s.dq)})).sort((a,b)=>b.risk-a.risk);
  const rec=m.filter(s=>s.prev<TARGET&&s.cur>=TARGET),imp=m.filter(s=>s.cur<TARGET&&s.dq>TOL),both=m.filter(s=>s.c>=2);
  const cw=wq(P,[CI]),pw=wq(P,[PI]);
  let h=`<h2 class="sec" style="margin-top:44px;border-top:2px solid var(--line);padding-top:24px">🔬 Volume and Error Deep Dive</h2><p class="hint">Quality = 1 - errors / (docs x fields per doc), which matches the location sheets. Covers all ${P.length} projects in view with production in ${PW} and ${CW}. No production this week: Fox Corporation and RXO and XPO Logistics. Closed: Eddie Bauer.</p>`;
  h+=`<div class="cards">${card("Documents, "+CW,cw.d.toLocaleString(),sg((cw.d/pw.d-1)*100,"% vs "+PW),"flat")}${card("Errors, "+CW,cw.e.toLocaleString(),sg((cw.e/pw.e-1)*100,"% vs "+PW),cw.e>pw.e?"down":"up")}${card("Errors per 100 docs",(100*cw.e/cw.d).toFixed(1),"was "+(100*pw.e/pw.d).toFixed(1))}${card("Volume-weighted quality",f2(cw.q),sg(cw.q-pw.q," pts vs "+PW),cw.q>=pw.q?"up":"down")}${card("Risk watchlist",watch.length,"below target and falling, or 2+ weeks in a row",watch.length?"down":"up")}${card("Below target 2+ weeks",both.length,"projects",both.length?"down":"up")}</div>`;
  const LS=LOCS.map(l=>({l,X:P.filter(s=>s.l===l)})).filter(o=>o.X.length);
  const mxd=Math.max(...LS.map(o=>Math.max(wq(o.X,[PI]).d,wq(o.X,[CI]).d)));
  h+=`<div class="grid2" style="margin-top:16px"><div class="panel"><h3>Volume-weighted quality by location</h3><p class="hint">Larger projects count for more. The axis does not start at zero.</p>${bars(LS.map(o=>o.l),[{name:PW,color:"var(--pale)",vals:LS.map(o=>wq(o.X,[PI]).q)},{name:CW,color:"var(--navy)",vals:LS.map(o=>wq(o.X,[CI]).q)}],560,280,false,{label:"Weighted quality by location"})}${leg([[PW,"var(--pale)"],[CW,"var(--navy)"]])}</div>
   <div class="panel"><h3>Documents received by location</h3><p class="hint">Weekly volume across projects in view</p>${bars(LS.map(o=>o.l),[{name:PW,color:"var(--pale)",vals:LS.map(o=>wq(o.X,[PI]).d)},{name:CW,color:"var(--navy)",vals:LS.map(o=>wq(o.X,[CI]).d)}],560,280,false,{cnt:1,lo:0,hi:Math.ceil(mxd*1.1/4000)*4000,label:"Documents by location"})}${leg([[PW,"var(--pale)"],[CW,"var(--navy)"]])}</div></div>`;

  h+=`<h3 style="margin:26px 0 10px">🚨 Risk watchlist</h3><div class="panel"><p class="hint">Below the 99% target and either falling this week or below target 2 or more weeks in a row. Ranked by gap, repeat weeks and size of the drop.</p>`+(watch.length?tbl(["Project","Location",PW,CW,"Weeks below target","Gap to 99%","Why flagged"],watch.map(s=>`<tr><td>${s.n}</td><td>${s.l}</td><td class="n">${f2(s.prev)}</td><td class="n"><b>${f2(s.cur)}</b></td><td class="n down">${s.c}</td><td class="n down">${sg(s.cur-TARGET)}</td><td>${[s.dq<0?"fell "+(-s.dq).toFixed(2)+" pts":"",s.c>=2?s.c+" weeks in a row":""].filter(Boolean).join(", ")}</td></tr>`)):'<div class="empty">No projects on the watchlist.</div>')+`</div>`;

  h+=`<div class="grid2" style="margin-top:16px"><div class="panel"><h3>✅ Recovered</h3><p class="hint">Below target last week, at or above target now</p><ol class="list">${rec.length?rec.map(s=>li({n:s.n,l:s.l},f2(s.prev)+" to "+f2(s.cur),"up")).join(""):'<li style="color:var(--muted)">None</li>'}</ol></div>
   <div class="panel"><h3>↗ Improving, still below target</h3><p class="hint">Moving up but not yet at 99%</p><ol class="list">${imp.length?imp.map(s=>li({n:s.n,l:s.l},sg(s.dq," pts")+", now "+f2(s.cur),"up")).join(""):'<li style="color:var(--muted)">None</li>'}</ol></div></div>`;

  const hs=[...m].sort((a,b)=>a.cur-b.cur);
  h+=`<h3 style="margin:26px 0 10px">📋 Project health</h3><div class="panel">`+tbl(["Project","Location","Fields per doc","Docs "+PW,"Docs "+CW,"Volume change","Errors "+CW,"Errors per 100 docs",CW+" quality","Change (pts)"],hs.map(s=>`<tr><td>${s.n}</td><td>${s.l}</td><td class="n">${s.f}</td><td class="n">${s.d[PI].toLocaleString()}</td><td class="n">${s.d[CI].toLocaleString()}</td><td class="n">${sg(s.dv,"%")}</td><td class="n">${s.e[CI].toLocaleString()}</td><td class="n">${(100*s.e[CI]/s.d[CI]).toFixed(1)}</td><td class="n"><b>${f2(s.cur)}</b></td><td class="n ${tcl(s.dq)}">${sg(s.dq)}</td></tr>`))+`<p class="hint" style="margin-top:10px">Projects with more fields per document have more chances for an error, so compare them on quality rather than raw error counts. Very small projects, such as Erie AP (50 documents in WK4) and Ariba Otsuka (87), can swing a lot on a few errors.</p></div>`;

  const ec=[...m].sort((a,b)=>b.e[CI]-a.e[CI]),te=sum(ec.map(s=>s.e[CI]));let cu=0;
  h+=`<h3 style="margin:26px 0 10px">🎯 Where the errors come from</h3><div class="panel"><p class="hint">${CW} errors by project. A few projects usually account for most errors, so fix those first.</p>`+ec.slice(0,8).map(s=>{cu+=s.e[CI];return `<div style="display:grid;grid-template-columns:minmax(120px,200px) 1fr 170px;gap:12px;align-items:center;padding:5px 0;font-size:14px"><span>${s.n}<small style="color:var(--muted);margin-left:6px">${s.l}</small></span><div style="background:var(--line);border-radius:4px;height:14px"><div style="width:${s.e[CI]/ec[0].e[CI]*100}%;height:100%;background:var(--navy);border-radius:4px"></div></div><span style="font-variant-numeric:tabular-nums"><b>${s.e[CI].toLocaleString()}</b> (${Math.round(s.e[CI]/te*100)}%, cum. ${Math.round(cu/te*100)}%)</span></div>`}).join("")+`</div>`;

  h+=`<h3 style="margin:26px 0 10px">📍 Location spread and weighting</h3><div class="panel">`+tbl(["Location","Projects","Simple average","Volume-weighted","Best project","Worst project","Spread (pts)"],LS.map(o=>{const X=m.filter(s=>s.l===o.l),b=[...X].sort((a,c)=>c.cur-a.cur),wo=b[b.length-1];
    return `<tr><td>${o.l}</td><td>${X.length}</td><td class="n">${f2(avg(X.map(s=>s.cur)))}</td><td class="n">${f2(wq(X,[CI]).q)}</td><td class="n">${b[0].n} ${b[0].cur.toFixed(2)}</td><td class="n">${wo.n} ${wo.cur.toFixed(2)}</td><td class="n"><b>${(b[0].cur-wo.cur).toFixed(2)}</b></td></tr>`}))+`<p class="hint" style="margin-top:10px">Simple average treats every project equally. Volume-weighted quality counts every field checked, so busy projects move it more.</p></div>`;
  return h}

function bars(cats,series,W,H,rot,o){
  o=o||{};const L=40,R=10,T=34,B=rot?82:30;let all=[];series.forEach(s=>s.vals.forEach(v=>{if(v!=null)all.push(v)}));
  let lo=o.lo,hi=o.hi;if(lo==null){lo=Math.max(97,Math.floor((Math.min(...all,TARGET)-0.1)*2)/2);hi=100}
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);let s="";
  for(let g=0;g<=4;g++){const gv=lo+(hi-lo)*g/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(gv)}" y2="${y(gv)}" stroke="var(--line)"/><text x="${L-6}" y="${y(gv)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${o.cnt?gv.toFixed(0):gv.toFixed(1)}</text>`}
  const gw=(W-L-R)/cats.length,bw=Math.min(o.cnt?26:18,gw*.8/series.length);
  cats.forEach((c,i)=>{const gx=L+gw*i+(gw-bw*series.length)/2;
    series.forEach((se,j)=>{const v=se.vals[i];if(v==null)return;const cx=gx+bw*j+(bw-1)/2,vc=Math.max(v,lo);
      s+=`<rect x="${gx+bw*j}" y="${y(vc)}" width="${bw-1}" height="${y(lo)-y(vc)}" rx="2" fill="${se.color}"><title>${c}, ${se.name}: ${o.cnt?v:f2(v)}</title></rect>`;
      s+=o.cnt?`<text x="${cx}" y="${y(vc)-5}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">${v}</text>`:`<text transform="translate(${cx+3.5} ${y(vc)-4}) rotate(-90)" font-size="10" fill="var(--ink)">${v.toFixed(2)}</text>`});
    const cx=L+gw*i+gw/2,cy=H-B+15,t=c.length>17?c.slice(0,16)+"…":c;
    s+=`<text x="${cx}" y="${cy}" font-size="11" fill="var(--muted)" text-anchor="${rot?"end":"middle"}"${rot?` transform="rotate(-35 ${cx} ${cy})"`:""}>${t}</text>`});
  if(!o.cnt)s+=`<line x1="${L}" x2="${W-R}" y1="${y(TARGET)}" y2="${y(TARGET)}" stroke="var(--ink)" stroke-dasharray="5 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||"Chart"}">${s}</svg>`;
}
const leg=a=>`<div class="legend">${a.map(x=>`<span><i style="background:${x[1]}"></i>${x[0]}</span>`).join("")}</div>`;
const card=(l,v,n,c)=>`<div class="card"><div class="l">${l}</div><div class="v ${c||""}">${v}</div><div class="n">${n}</div></div>`;
const li=(r,val,c)=>`<li><span>${r.n}<small>${r.l}</small></span><b class="${c||""}">${val}</b></li>`;

function getRows(){return ROWS.filter(r=>(F.loc==="All Locations"||r.l===F.loc)&&(F.band==="All"||BN[band(r.cu)]===F.band.split(" (")[0])&&(F.trend==="All"||trend(r.d)===F.trend))}

/* Weekly trend explorer: location and project drop-downs */
let TS={loc:"All Locations",proj:"All Projects"};
const PAL=["#2f6fb0","#c27d0e","#1e8e5a","#c53a30","#6b5aa8","#0e8a8a","#a0522d","#8a8f98","#d2691e","#4b6584"];
const cc=v=>v==null?"var(--muted)":v>=TARGET?"var(--green)":v>=TARGET-.5?"var(--amber)":"var(--red)";
function lines2(cats,series,W,H){
  const L=48,R=40,T=22,B=30;let all=[TARGET];series.forEach(s=>s.v.forEach(v=>{if(v!=null)all.push(v)}));
  let lo=Math.min(...all),hi=Math.max(...all);const pd=(hi-lo)*.15||.2;lo-=pd;hi+=pd;
  const x=i=>L+i*(W-L-R)/(cats.length-1),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);let s="";
  for(let g=0;g<=4;g++){const gv=lo+(hi-lo)*g/4;s+=`<line x1="${L}" x2="${W-R}" y1="${y(gv)}" y2="${y(gv)}" stroke="var(--line)"/><text x="${L-6}" y="${y(gv)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${gv.toFixed(1)}</text>`}
  cats.forEach((c,i)=>s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${c}</text>`);
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(TARGET)}" y2="${y(TARGET)}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(TARGET)-5}" text-anchor="end" font-size="11" fill="var(--muted)">Target ${TARGET}%</text>`;
  series.forEach(se=>{let seg=[];const flush=()=>{if(seg.length>1)s+=`<polyline fill="none" stroke="${se.c}" stroke-width="${se.w||2}" stroke-linejoin="round" points="${seg.map(p=>p.join(",")).join(" ")}"/>`;seg=[]};
    se.v.forEach((v,i)=>{if(v==null){flush();return}seg.push([x(i),y(v)]);});flush();
    se.v.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${(se.w||2)>3?4.5:3.5}" fill="${se.c}"><title>${se.name}, ${cats[i]}: ${v.toFixed(2)}%</title></circle>`})});
  cats.forEach((c,i)=>{const a=[];series.forEach(se=>{if(se.lab&&se.v[i]!=null)a.push({y:y(se.v[i]),v:se.v[i],c:se.c})});a.sort((p,q)=>p.y-q.y);
    for(let k=1;k<a.length;k++)if(a[k].y-a[k-1].y<13)a[k].y=a[k-1].y+13;
    a.forEach(t=>s+=`<text x="${x(i)+(i===cats.length-1?-9:9)}" y="${t.y+4}" text-anchor="${i===cats.length-1?"end":"start"}" font-size="11" font-weight="600" fill="${t.c}">${t.v.toFixed(2)}</text>`)});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weekly quality trend">${s}</svg>`}
function projOpts(){const n=Object.values(S).filter(s=>TS.loc==="All Locations"||s.l===TS.loc).map(s=>s.n).sort();
  return ["All Projects",...n].map(o=>`<option${o===TS.proj?" selected":""}>${o}</option>`).join("")}
function trendOut(){
  const ix=[0,1,2,3],SPv=Object.values(S),X=SPv.filter(s=>TS.loc==="All Locations"||s.l===TS.loc);
  const wl=(name,c,set,w)=>({name,c,w,lab:1,n:set.length,v:ix.map(i=>{const r=wq(set,[i]);return r?r.q:null})});
  const chg=a=>{const v=a.filter(x=>x!=null);return v.length>1?v[v.length-1]-v[0]:null};
  const cell=v=>`<td class="n" style="color:${cc(v)};font-weight:600">${v==null?"–":v.toFixed(2)+"%"}</td>`;
  const chgCell=a=>{const d=chg(a);return `<td class="n ${tcl(d)}">${d==null?"–":sg(d," pts")}</td>`};
  let series,head,rows,title;
  if(TS.proj!=="All Projects"){
    const s=S[TS.proj];title=s.n+" ("+s.l+")";series=[{name:s.n,c:"var(--navy)",w:3,lab:1,v:ix.map(i=>s.q[i]??null)}];
    head=["Week","Location","Quality","Documents","Errors","Errors per 100 docs","Change vs prior week"];
    rows=ix.filter(i=>s.d[i]!=null).map((i,k,a)=>{const p=a[k-1];return `<tr><td>${WK[i]}</td><td>${s.l}</td>${cell(s.q[i])}<td class="n">${s.d[i].toLocaleString()}</td><td class="n">${s.e[i].toLocaleString()}</td><td class="n">${(100*s.e[i]/s.d[i]).toFixed(1)}</td><td class="n ${p==null?"":tcl(s.q[i]-s.q[p])}">${p==null?"–":sg(s.q[i]-s.q[p]," pts")}</td></tr>`});
  }else if(TS.loc==="All Locations"){
    title="All locations, volume-weighted";series=[wl("All locations","var(--navy)",SPv,3.5),...LOCS.map(l=>wl(l,LC[l],SPv.filter(s=>s.l===l),2.2))];
    head=["Location","Projects",...WK,"Change"];
    rows=series.map((se,k)=>`<tr><td>${k?se.name:"<b>"+se.name+"</b>"}</td><td class="n">${se.n}</td>${se.v.map(cell).join("")}${chgCell(se.v)}</tr>`);
  }else{
    title=TS.loc+": weighted average and every project";
    series=[wl(TS.loc+" (weighted)","var(--navy)",X,3.5),...X.map((s,k)=>({name:s.n,c:PAL[k%PAL.length],w:1.8,lab:0,v:ix.map(i=>s.q[i]??null)}))];
    head=["Project","Location",...WK,"Change"];
    rows=series.map((se,k)=>`<tr><td>${k?se.name:"<b>"+se.name+"</b>"}</td><td>${k?TS.loc:""}</td>${se.v.map(cell).join("")}${chgCell(se.v)}</tr>`);
  }
  return `<h3>${title}</h3><p class="hint">Quality % by week. A gap means no production that week. The dashed line is the ${TARGET}% target and the axis does not start at zero.</p>${lines2(WK,series,640,300)}${leg(series.map(se=>[se.name,se.c]))}<div style="margin-top:16px">${tbl(head,rows)}</div>`}
function tChange(k,v){if(k==="loc"){TS.loc=v;TS.proj="All Projects"}else TS.proj=v;
  document.getElementById("tProj").innerHTML=projOpts();document.getElementById("tOut").innerHTML=trendOut()}
function trendSec(){return `<h2 class="sec">📈 Weekly Trend: Location and Project</h2><div class="panel"><div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px"><label>Location<select id="tLoc" onchange="tChange('loc',this.value)">${["All Locations",...LOCS].map(o=>`<option${o===TS.loc?" selected":""}>${o}</option>`).join("")}</select></label><label>Project<select id="tProj" onchange="tChange('proj',this.value)">${projOpts()}</select></label></div><div id="tOut">${trendOut()}</div></div>`}

function render(){
  const R=getRows(),n=R.length;
  document.getElementById("fInfo").textContent=`Showing ${n} of ${ROWS.length} projects`;
  const app=document.getElementById("app");
  if(!n){app.innerHTML='<div class="panel empty" style="margin-top:20px">No projects match these filters. Reset the filters to see all projects.</div>';return}
  const cur=avg(R.map(r=>r.cu)),pr=avg(R.map(r=>r.pr)),wow=cur!=null&&pr!=null?cur-pr:null;
  const bc=[0,0,0,0];R.forEach(r=>bc[band(r.cu)]++);
  const tc={Improved:0,Declined:0,Stable:0};R.forEach(r=>tc[trend(r.d)]++);
  const onT=R.filter(r=>r.cu>=TARGET).length;
  let h=`<h2 class="sec">📊 Primary KPIs</h2><div class="cards">
   ${card("Overall Quality",f2(cur),CW+" average")}
   ${card("WoW Change",sg(wow," pts"),"vs prior week",tcl(wow))}
   ${card("Prior Week",f2(pr),PW+" baseline")}
   ${card("Gap to 100%",(100-cur).toFixed(2)+" pts","Room to improve")}
   ${card("Vs 99% Target",sg(cur-TARGET," pts"),onT+" of "+n+" projects at or above target",cur>=TARGET?"up":"down")}</div>
  <div class="cards" style="margin-top:14px">
   ${card("Improved",tc.Improved,"projects","up")}${card("Declined",tc.Declined,"projects","down")}${card("Stable",tc.Stable,"projects","flat")}
   ${card("Excellent",bc[0],"≥ 99.50%","up")}${card("Needs Attention",bc[3],"< 98.50%",bc[3]?"down":"")}</div>`;

  h+=`<h2 class="sec">🎯 Quality Band Distribution</h2><div class="panel"><div class="stack">${bc.map((c,i)=>c?`<span style="width:${c/n*100}%;background:${BC[i]}" title="${BN[i]}: ${c}">${c}</span>`:"").join("")}</div>${leg(BN.map((b,i)=>[`${b}: ${bc[i]} (${Math.round(bc[i]/n*100)}%)`,BC[i]]))}</div>`;

  const ls=LOCS.filter(l=>R.some(r=>r.l===l));
  h+=`<h2 class="sec">📍 KPI Details by Location</h2><div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">`+ls.map(l=>{
    const s=R.filter(r=>r.l===l),c=avg(s.map(r=>r.cu)),p=avg(s.map(r=>r.pr)),d=c!=null&&p!=null?c-p:null;
    const hi=[...s].sort((a,b)=>b.cu-a.cu)[0],lo=[...s].sort((a,b)=>a.cu-b.cu)[0];
    return `<div class="card loc"><h3>${l}<span class="${tcl(d)}" style="font-size:14px">${sg(d," pts")}</span></h3><div class="big">${f2(c)}</div><div class="n" style="color:var(--muted);font-size:13px">${CW} average, ${s.length} projects</div>
     <dl><dt>${PW}</dt><dd>${f2(p)}</dd><dt>At or above target</dt><dd>${s.filter(r=>r.cu>=TARGET).length} of ${s.length}</dd><dt>Highest</dt><dd>${hi.n} ${hi.cu.toFixed(2)}</dd><dt>Lowest</dt><dd>${lo.n} ${lo.cu.toFixed(2)}</dd></dl></div>`}).join("")+`</div>`;

  const imp=[...R].filter(r=>r.d>TOL).sort((a,b)=>b.d-a.d).slice(0,5),dec=[...R].filter(r=>r.d<-TOL).sort((a,b)=>a.d-b.d).slice(0,5);
  const top=[...R].sort((a,b)=>b.cu-a.cu).slice(0,5),low=[...R].sort((a,b)=>a.cu-b.cu).slice(0,5);
  const lst=(t,a,fn,c)=>`<div class="panel"><h3>${t}</h3><ol class="list">${a.length?a.map(r=>li(r,fn(r),c)).join(""):'<li style="color:var(--muted)">None with these filters</li>'}</ol></div>`;
  h+=`<h2 class="sec">🏆 Rankings and Movers</h2><div class="grid2">${lst("▲ Top Improvers",imp,r=>sg(r.d," pts"),"up")}${lst("▼ Top Decliners",dec,r=>sg(r.d," pts"),"down")}${lst("⭐ Highest Quality",top,r=>f2(r.cu))}${lst("🔻 Lowest Quality",low,r=>f2(r.cu),"down")}</div>`;

  const locAv=ls.map(l=>[l,avg(R.filter(r=>r.l===l).map(r=>r.cu))]).sort((a,b)=>b[1]-a[1]);
  const avgD=avg(R.map(r=>r.d)),mx=[...R].sort((a,b)=>b.d-a.d)[0],mn=[...R].sort((a,b)=>a.d-b.d)[0];
  h+=`<h2 class="sec">📈 Additional KPI Insights</h2><div class="panel"><ul class="ins">
   <li>${onT} of ${n} projects (${Math.round(onT/n*100)}%) are at or above the 99% target.</li>
   <li>${locAv[0][0]} leads at ${f2(locAv[0][1])}${locAv.length>1?`; ${locAv[locAv.length-1][0]} is lowest at ${f2(locAv[locAv.length-1][1])}`:""}.</li>
   <li>Average project change is ${sg(avgD," pts")}. Biggest gain: ${mx.n} (${sg(mx.d," pts")}). Biggest drop: ${mn.n} (${sg(mn.d," pts")}).</li>
   <li>${bc[3]?bc[3]+" project(s) are below 98.50% and need attention: "+R.filter(r=>band(r.cu)===3).map(r=>r.n).join(", ")+".":"No project is below 98.50%."}</li>
   <li>No production this week: Fox Corporation (Hyderabad) and RXO and XPO Logistics (Turbhe). Closed: Eddie Bauer (Mumbai).</li></ul></div>`;

  let off=0;const arcs=bc.map((c,i)=>{const len=c/n*377,e=c?`<circle r="60" cx="90" cy="90" fill="none" stroke="${BC[i]}" stroke-width="30" stroke-dasharray="${len} ${377-len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${BN[i]}: ${c}</title></circle>`:"";off+=len;return e}).join("");
  const donut=`<svg viewBox="0 0 180 180" style="max-width:240px;margin:0 auto" role="img" aria-label="Performance mix">${arcs}<text x="90" y="88" text-anchor="middle" font-size="26" font-weight="600" fill="var(--ink)">${n}</text><text x="90" y="106" text-anchor="middle" font-size="11" fill="var(--muted)">projects</text></svg>`;
  h+=`<h2 class="sec">📉 KPI Charts</h2><div class="grid2"><div class="panel"><h3>Performance Mix</h3><p class="hint">Projects by quality band, ${CW}</p>${donut}${leg(BN.map((b,i)=>[`${b} ${bc[i]}`,BC[i]]))}</div>
   <div class="panel"><h3>Location Quality vs 99% Target</h3><p class="hint">Average ${CW} quality. The dashed line is the target and the axis does not start at zero.</p>${bars(ls,[{name:CW,color:"var(--navy)",vals:ls.map(l=>avg(R.filter(r=>r.l===l).map(r=>r.cu)))}],560,280,false,{label:"Location quality vs target"})}</div></div>`;

  const SER=s=>[{name:PW,color:"var(--pale)",vals:s.map(r=>r.pr)},{name:CW,color:"var(--navy)",vals:s.map(r=>r.cu)}];
  h+=trendSec();
  h+=`<h2 class="sec">📍 Location Graphs: Detailed View</h2>`+ls.map(l=>{const s=R.filter(r=>r.l===l);
    return `<div class="panel" style="margin-bottom:14px"><h3 style="display:flex;justify-content:space-between"><span>${l}</span><span>${f2(avg(s.map(r=>r.cu)))}</span></h3><p class="hint">${s.length} projects, ${PW} vs ${CW}</p><div class="scroll"><div style="min-width:${Math.max(520,s.length*60)}px">${bars(s.map(r=>r.n),SER(s),700,310,true,{label:l+" projects"})}</div></div>${leg([[PW,"var(--pale)"],[CW,"var(--navy)"]])}</div>`}).join("");

  const cnt=k=>ls.map(l=>{const v=R.filter(r=>r.l===l&&trend(r.d)===k).length;return v||null});
  const mxc=Math.max(1,...R.length?ls.map(l=>Math.max(...["Improved","Stable","Declined"].map(k=>R.filter(r=>r.l===l&&trend(r.d)===k).length))):[1]);
  h+=`<div class="grid2"><div class="panel"><h3>Location: Improved vs Declined</h3><p class="hint">Project count by trend at each location</p>${bars(ls,[{name:"Improved",color:"var(--green)",vals:cnt("Improved")},{name:"Stable",color:"var(--grey)",vals:cnt("Stable")},{name:"Declined",color:"var(--red)",vals:cnt("Declined")}],560,270,false,{cnt:1,lo:0,hi:Math.ceil((mxc+.5)/4)*4,label:"Trend counts by location"})}${leg([["Improved","var(--green)"],["Stable","var(--grey)"],["Declined","var(--red)"]])}</div>
   <div class="panel"><h3>Location: Prior vs Current Quality</h3><p class="hint">Week-over-week average quality</p>${bars(ls,SER(ls.map(l=>({pr:avg(R.filter(r=>r.l===l).map(r=>r.pr)),cu:avg(R.filter(r=>r.l===l).map(r=>r.cu))}))),560,270,false,{label:"Prior vs current by location"})}${leg([[PW,"var(--pale)"],[CW,"var(--navy)"]])}</div></div>`;

  const rk=[...R].sort((a,b)=>b.cu-a.cu);
  h+=`<h2 class="sec">Project Quality Detail (${n})</h2><div class="panel"><div class="scroll"><table><thead><tr><th>#</th><th>Location</th><th>Project</th><th class="n">${PW}</th><th class="n">${CW}</th><th class="n">Variance</th><th>Trend</th><th>Performance</th><th class="n">vs Target</th></tr></thead><tbody>`+
   rk.map((r,i)=>{const b=band(r.cu),t=trend(r.d),vt=r.cu-TARGET;return `<tr><td>${i+1}</td><td>${r.l}</td><td>${r.n}</td><td class="n">${f2(r.pr)}</td><td class="n"><b>${f2(r.cu)}</b></td><td class="n ${tcl(r.d)}">${sg(r.d)}</td><td class="${tcl(r.d)}">${t==="Improved"?"▲ ":t==="Declined"?"▼ ":"● "}${t}</td><td><span class="badge" style="background:${BC[b]}">${BN[b]}</span></td><td class="n ${vt>=0?"up":"down"}">${sg(vt)}</td></tr>`}).join("")+`</tbody></table></div></div>`;
  app.innerHTML=h+deep(R);
}
document.getElementById("sub").textContent=`Hyderabad · Mumbai · Turbhe | ${CW} compared with ${PW}, ${ROWS.length} reporting projects`;
const g=id=>document.getElementById(id);
g("apply").onclick=()=>{F={loc:g("fLoc").value,band:g("fBand").value,trend:g("fTrend").value};render()};
g("reset").onclick=()=>{["fLoc","fBand","fTrend"].forEach(i=>g(i).selectedIndex=0);F={loc:"All Locations",band:"All",trend:"All"};render()};
render();
</script>
</body>
</html>
